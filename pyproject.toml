[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "randomprime-standalone"
version = "0.0.3"
description = "Standalone GUI for applying randomprime patcher JSON to a Metroid Prime ISO"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "py-randomprime",
]

[project.scripts]
randomprime = "randomprime_standalone.__main__:main"

[dependency-groups]
dev = [
    "click",
    "nuitka",
    "zstandard",
    "patchelf; sys_platform == 'linux'",
    "pytest",
    "pytest-xdist",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-n auto"

[tool.setuptools.packages.find]
include = ["randomprime_standalone*"]

[tool.setuptools.package-data]
randomprime_standalone = ["assets/*"]
