name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Bump version
        id: bump
        run: echo "version=$(uv version --bump ${{ inputs.bump }} --short)" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD "v${{ steps.bump.outputs.version }}"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: randomprime-standalone.exe
          - os: ubuntu-latest
            asset: randomprime-standalone-linux
          - os: macos-latest
            asset: randomprime-standalone-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: astral-sh/setup-uv@v6
      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make -y
      - run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: build/dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
