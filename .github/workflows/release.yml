name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: make test

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Bump version
        id: bump
        run: echo "version=$(./tools/uv.sh version --bump ${{ inputs.bump }} --short)" >> "$GITHUB_OUTPUT"
      - run: ./tools/uv.sh lock
      - uses: actions/upload-artifact@v7
        with:
          name: version-files
          path: |
            pyproject.toml
            uv.lock
          if-no-files-found: error

  build:
    needs: version
    # Release toggle: standalone executables. Set to false to disable for this repo.
    if: true
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: version-files
      - uses: astral-sh/setup-uv@v7
      # On Windows, install make into this shell before calling it.
      - name: Build release
        shell: pwsh
        run: |
          if ($IsWindows) { ./tools/install-bash.ps1 }
          make release
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.platform }}
          path: |
            build/*.zip
            build/*.tar.gz
          if-no-files-found: error

  pypi:
    needs: version
    # Release toggle: PyPI package. Set to true (and configure trusted publishing) to enable.
    if: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: version-files
      - uses: astral-sh/setup-uv@v7
      - run: make publish

  publish:
    needs: [version, build, pypi]
    if: always() && needs.version.result == 'success' && needs.build.result != 'failure' && needs.pypi.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: version-files
      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
        continue-on-error: true
      - name: Commit, tag, and atomic push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v${{ needs.version.outputs.version }}"
          git tag "v${{ needs.version.outputs.version }}"
          git push --atomic origin HEAD "v${{ needs.version.outputs.version }}"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
